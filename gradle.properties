# Gradle's default 512 MiB heap is insufficient for Compose + Android builds.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
# Android Studio Rabbit bundles JDK 25, while Gradle 8.7 supports up to JDK 21.
# Use the locally installed compatible JDK to keep project sync deterministic.
org.gradle.java.home=C:/jdk/jdk-20.0.2
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
